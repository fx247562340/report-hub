# Report Hub · 仅对外暴露前端 15173
#   docker compose up -d --build
# 访问 http://服务器IP:15173 ；API/PG 不对公网开放

services:
  db:
    image: postgres:16-alpine
    container_name: report-hub-pg
    environment:
      POSTGRES_DB: reporthub
      POSTGRES_USER: reporthub
      POSTGRES_PASSWORD: ${DB_PASSWORD:-reporthub}
    # 不映射宿主机端口，仅 compose 内网
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reporthub -d reporthub"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build: ./backend
    container_name: report-hub-api
    environment:
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://db:5432/reporthub
      DB_USER: reporthub
      DB_PASSWORD: ${DB_PASSWORD:-reporthub}
      DB_DRIVER: org.postgresql.Driver
      JWT_SECRET: ${JWT_SECRET:-report-hub-compose-secret-change-me-32bytes!}
      SEED_DEMO: "true"
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx768m}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    # 不映射宿主机端口；由 web (Nginx) 反代 /api
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health | grep -q ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    restart: unless-stopped

  web:
    build: ./frontend
    container_name: report-hub-web
    ports:
      # 唯一对外端口
      - "${WEB_PORT:-15173}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
